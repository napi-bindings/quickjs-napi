name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # quickjs-build is built from source as a sibling directory (the default of
  # QJSNAPI_QUICKJS_DIR and of the toolchain path in CMakePresets.json).
  # The branch with QuickJS 2026-06-04; switch to a tag once it is released.
  QUICKJS_BUILD_REF: feat/quickjs-2026-06-04
  # Same major version as the local parity runs (Node.js 22.23).
  NODE_VERSION: "22"
  # UBSan findings fail the test (-fno-sanitize-recover is set by CMake too).
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
  # A data race fails the test at the first report.
  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

jobs:
  # ----------------------------------------------------------------------------
  # Linux and macOS: native builds with the system compiler. The Debug builds
  # keep QuickJS's assertion that JS_FreeRuntime finds no live object, so every
  # test is also a leak check; unix-asan adds ASan + UBSan to everything,
  # QuickJS included; unix-tsan runs ThreadSanitizer over the thread-pool and
  # thread-safe function tests (and the rest). The node_parity_* tests run the
  # same addons under Node.js.
  # ----------------------------------------------------------------------------
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-debug
            os: ubuntu-24.04
            preset: unix-debug
            cc: gcc
          - name: linux-gcc-release
            os: ubuntu-24.04
            preset: unix-release
            cc: gcc
          - name: linux-clang-debug
            os: ubuntu-24.04
            preset: unix-debug
            cc: clang
          - name: linux-gcc-asan-ubsan
            os: ubuntu-24.04
            preset: unix-asan
            cc: gcc
          - name: linux-gcc-tsan
            os: ubuntu-24.04
            preset: unix-tsan
            cc: gcc
          - name: macos-arm64-debug
            os: macos-latest
            preset: unix-debug
            cc: cc
    defaults:
      run:
        working-directory: quickjs-napi
    steps:
      - uses: actions/checkout@v7
        with:
          path: quickjs-napi
      - uses: actions/checkout@v7
        with:
          repository: napi-bindings/quickjs-build
          ref: ${{ env.QUICKJS_BUILD_REF }}
          path: quickjs-build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Ninja
        run: python -m pip install ninja
      # The ubuntu-24.04 kernel randomizes mmap with 32 bits, more than the
      # ThreadSanitizer runtime supports ("unexpected memory mapping").
      - name: Reduce ASLR entropy for ThreadSanitizer
        if: matrix.preset == 'unix-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          ${{ matrix.cc }} --version
          node --version
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ matrix.name }}
          path: quickjs-napi/build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # Windows: QuickJS cannot be built with MSVC, so the host and the test addons
  # are built with `zig cc` (MinGW-w64, UCRT) through the presets, exactly as
  # on a developer machine. The parity tests with Node.js are skipped here:
  # the test addons import Node-API from quickjs-napi.exe.
  # ----------------------------------------------------------------------------
  windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-zig-debug
            preset: windows-zig-debug
          - name: windows-x64-zig-release
            preset: windows-zig-release
    defaults:
      run:
        shell: bash
        working-directory: quickjs-napi
    steps:
      - uses: actions/checkout@v7
        with:
          path: quickjs-napi
      - uses: actions/checkout@v7
        with:
          repository: napi-bindings/quickjs-build
          ref: ${{ env.QUICKJS_BUILD_REF }}
          path: quickjs-build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install zig and Ninja
        run: |
          python -m pip install ninja "ziglang==$(cat ../quickjs-build/.zigversion)"
          python -c "import os, ziglang; print(os.path.dirname(ziglang.__file__))" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          zig version
          cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ matrix.name }}
          path: quickjs-napi/build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
